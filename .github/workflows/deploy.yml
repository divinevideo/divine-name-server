# ABOUTME: GitHub Actions workflow that auto-deploys to Cloudflare Workers
# ABOUTME: Triggers on push to main, runs the checks, then deploys via wrangler

name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  # Deploying is what publishes a change, so the checks gate it rather than
  # merely reporting alongside it. This is the same workflow CI runs on the
  # pull request, so a change cannot pass review under one set of checks and
  # ship under another.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install admin-ui dependencies
        run: npm ci
        working-directory: admin-ui

      - name: Build admin-ui
        run: npm run build
        working-directory: admin-ui

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
